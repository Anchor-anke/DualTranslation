name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - label: macOS Intel
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            apple_signing_identity: "-"
          - label: Windows x64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: DualTranslation v__VERSION__
          releaseBody: |
            DualTranslation v__VERSION__ 新增多项目上下文，让 Agent 在生成提示词前先理解你的本地项目。

            本次更新：
            - 可选择并记住多个本地项目，支持固定、最近使用与最多 3 个项目同时参与转换。
            - 智能扫描项目技术栈与任务相关文件，并允许在发送前预览、取消选择上下文文件。
            - 默认使用智能模式；信息不足时先追问，再结合补充答案继续生成。
            - 项目文件按不可信证据处理，要求输出引用来源路径，降低脱离代码上下文的幻觉。
            - 自动忽略 `.env`、凭据、私钥、证书、构建产物和常见依赖目录，并在发送前执行隐私扫描与脱敏。
            - 转换历史会记录所关联的本地项目，方便多项目并行工作时快速恢复上下文。
            - 修复不可变 GitHub Release 下的多平台附件聚合，确保 Apple Silicon、Intel Mac 与 Windows 安装包完整发布。
            - 保持 API Key 仅存储在操作系统凭据库中。

            下载说明：
            - Windows 10/11 x64：下载 `.msi` 或 `-setup.exe`。
            - Apple Silicon Mac：下载文件名包含 `aarch64` 的 `.dmg`。
            - Intel Mac：下载文件名包含 `x64` 或 `x86_64` 的 `.dmg`。

            本版本尚未配置商业代码签名。安装时 macOS Gatekeeper 或 Windows SmartScreen 可能提示未知开发者，请确认文件来自本 Release 页面后再继续。

            API Key 只保存在操作系统凭据库中，不包含在应用安装包、源码或 Release 附件内。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    name: Publish completed release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Publish release after every installer is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
