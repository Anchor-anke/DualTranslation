[package]
name = "dual-translation"
version = "0.2.1"
description = "A bidirectional semantic compiler between people and coding agents"
authors = ["DualTranslation contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "dual_translation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
jsonschema = { version = "0.49.3", default-features = false }
keyring = "4.1.6"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.19"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
url = "2"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
